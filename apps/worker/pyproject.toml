[project]
name = "multi-asset-invest-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "pydantic-settings>=2.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.2.0",
    "pytest>=7.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = []
