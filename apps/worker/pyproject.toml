[project]
name = "multi-asset-invest-worker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "multi-asset-invest-shared",
    "beautifulsoup4>=4.12.0",
    "openai>=1.0.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "playwright>=1.40.0",
    "pydantic-settings>=2.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.2.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that need real DB (deselect with '-m \"not integration\"')",
]

[tool.uv.sources]
multi-asset-invest-shared = { path = "../../packages/shared", editable = true }

[tool.ruff]
target-version = "py314"
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = []
extend-per-file-ignores = { "src/pipelines/prompts/*.py" = ["E501"] }
