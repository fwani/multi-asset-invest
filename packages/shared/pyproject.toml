[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]

[project]
name = "multi-asset-invest-shared"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.25",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py314"
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = []
